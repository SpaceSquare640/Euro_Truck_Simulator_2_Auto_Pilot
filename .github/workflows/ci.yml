# Edited by: Anthropic-Claude_Code
# Each module job runs only when its directory exists, so CI can go live before the code does.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.d.outputs.native }}
      python: ${{ steps.d.outputs.python }}
      ui: ${{ steps.d.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          echo "native=$([ -f native/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -f python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ui=$(ls ui/*.sln ui/*.slnx 2>/dev/null | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"

  native:
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S native -B build/native -A x64
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
