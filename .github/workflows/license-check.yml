# Fails when a dependency uses a license outside the allow-list in CONTRIBUTING.md.
name: License Check

on:
  push:
    paths:
      - "python/pyproject.toml"
      - "python/requirements*.txt"
      - "ui/**/*.csproj"
      - "packaging/**/*.wixproj"
      - "packaging/**/*.csproj"
      - "**/Directory.Packages.props"
      - "**/packages.lock.json"
      - "**/nuget.config"
      - "**/NuGet.Config"
      - "**/Directory.Build.props"
      - "**/Directory.Build.targets"
      - ".github/scripts/check-nuget-licenses.ps1"
      - ".github/workflows/license-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if no Python project
        id: has
        shell: bash
        run: echo "py=$([ -f python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.py == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - if: steps.has.outputs.py == 'true'
        working-directory: python
        run: |
          pip install .
          pip install pip-licenses
          pip-licenses --partial-match --allow-only="MIT;BSD;Apache;ISC;zlib;Python Software Foundation"

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore .NET dependency graphs
        shell: pwsh
        run: |
          dotnet restore ui/ETS2AP.Ui.csproj
          dotnet restore packaging/windows/ETS2AP.Installer.wixproj
      - name: Check UI NuGet licenses
        shell: pwsh
        run: >-
          ./.github/scripts/check-nuget-licenses.ps1
          -AssetsFile ui/obj/project.assets.json
      - name: Check CI-only WiX NuGet licenses
        shell: pwsh
        run: >-
          ./.github/scripts/check-nuget-licenses.ps1
          -AssetsFile packaging/windows/obj/project.assets.json
          -AdditionalPackage WixToolset.Sdk/6.0.2
          -AllowCiOnlyWixMsRl
