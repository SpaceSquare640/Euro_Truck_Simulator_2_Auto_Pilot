# Add pip / nuget ecosystems once python/ and ui/ manifests exist.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Website pins Astro 7.x and TypeScript 6.x; @astrojs/check 0.9.12 supports only TypeScript ^5 or ^6, so major updates can break the website build.
  - package-ecosystem: npm
    directory: /
    target-branch: Euro_Truck_Simulator_2_Auto_Pilot_Website
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
